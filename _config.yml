# ==================== Site ====================
title: LoongChong's Blog
subtitle: 'Agent 应用开发 / 后端工程 / 大模型实战'
description: '面向 Agent 应用开发工程师的技术笔记：RAG、LangChain、Java 设计模式、大模型工程化。'
keywords: 'Agent,RAG,LangChain,Java,设计模式,大模型,LLM,后端'
author: LoongChong
language: zh-CN
timezone: Asia/Shanghai

# ==================== URL ====================
## 关键！见下方 4.1 的说明
url: https://LoongChong.github.io/blog
root: /blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ==================== Directory ====================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ==================== Writing ====================
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false      # 建议保持 false，图片统一放 source/img
relative_link: false
future: true
highlight:
  enable: false               # 交给 Butterfly 的 highlight 设置，这里关掉
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ==================== 分类与标签 ====================
default_category: uncategorized
category_map:
tag_map:

# ==================== 日期格式 ====================
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'       # 用文件修改时间作为"更新于"，更准确

# ==================== 分页 ====================
per_page: 10                  # 首页每页文章数
index_generator:
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 30
  yearly: true
  monthly: true
  daily: false
  order_by: -date
tag_generator:
  per_page: 20
  order_by: -date
category_generator:
  per_page: 20
  order_by: -date

# ==================== Extensions ====================
theme: butterfly

# 搜索索引（装了 hexo-generator-searchdb 后生效）
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS（装了 hexo-generator-feed 后生效）
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 200
  content_limit_delim: '<!-- more -->'
  order_by: -date

# Sitemap（装了 hexo-generator-sitemap 后生效）
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# 数学公式（装了 hexo-renderer-kramed 后生效）
mathjax:
  enable: true